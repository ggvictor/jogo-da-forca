<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOGO DA FORCA</title>
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Jogo da forca</h1>
        <div class="row">
            <div class="title">
                <img src="img/futebol.png" alt="bola de futebol" id="icon">
                <h2 class="game-name">Futebol</h2>
            </div>
            <img src="img/forca.png" alt="forca" id="forca-img">
        </div> 
        <div class="centro">
            <div class="game">
                <div class="inputs">
                    <!-- <input type="text" class="letter" disabled>
                    <input type="text" class="letter" disabled>
                    <input type="text" class="letter" disabled> -->
                </div>
                <div class="row">
                    <input type="text" class= "line" maxlength="1">
                    <input type="button" value="chutar" class="button">
                </div>
                <p id="wrong"></p>
            </div>
        </div>
        <div class="lose">
            <h3>PERDEU!!! QUER TENTAR OUTRA VEZ?</h3>
            <p>A palavra era: <span>Palavra</span></p>
            <button>Reiniciar</button>
        </div>
        <div class="win">
             <h3>PARABENS!!! QUER TENTAR OUTRA VEZ?</h3>
             <p>A palavra era: <span id = "palavra">Palavra</span></p>
             <button>Reiniciar</button>
        </div>
    </div>
</body>
</html>
